<h1>List of employees</h1>
<form onsubmit="return addEmployee()">
    <label for="employee_first_name">First Name:</label>
    <input type="text" id="employee_first_name" placeholder="Employee First Name"/><br>
    <label for="employee_last_name">Last Name:</label>
    <input type="text" id="employee_last_name" placeholder="Employee Last Name"/><br>
    <label for="employee_email">Email:</label>
    <input type="email" id="employee_email" placeholder="Employee Email"/><br>
    <label for="employee_phone_number">Phone Number:</label>
    <input type="text" id="employee_phone_number" placeholder="Employee Phone Number"/><br>
    <label for="employee_department">Department:</label>
    <input type="text" id="employee_department" placeholder="Employee Department"/><br>
    <label for="employee_position">Position:</label>
    <input type="text" id="employee_position" placeholder="Employee Position"/><br>
    <label for="employee_start_date">Start Date:</label>
    <input type="date" id="employee_start_date"/><br>
    <label for="employee_salary">Salary:</label>
    <input type="number" id="employee_salary" placeholder="Employee Salary"/><br>
    <button type="submit">Add Employee</button>
</form>
<a href="http://127.0.0.1:5000/hr-app">Back to Home Page</a>
<div id="list-of-employees"></div>
<script>
    let empList = [];
    function addEmployee() {
        event.preventDefault();
        const employee = {
            first_name: document.getElementById('employee_first_name').value,
            last_name: document.getElementById('employee_last_name').value,
            email: document.getElementById('employee_email').value,
            phone_number: document.getElementById('employee_phone_number').value,
            department: document.getElementById('employee_department').value,
            position: document.getElementById('employee_position').value,
            start_date: document.getElementById('employee_start_date').value,
            salary: parseFloat(document.getElementById('employee_salary').value)
        };
        empList.push(employee);
        let listOfEmployees = document.getElementById('list-of-employees');
        listOfEmployees.innerHTML = '';
        for(let i = 0; i<empList.length; i++){
            listOfEmployees.innerHTML += `<p>${empList[i].first_name} ${empList[i].last_name} - ${empList[i].email} - ${empList[i].phone_number} - ${empList[i].department} - ${empList[i].position} - ${empList[i].start_date} - ${empList[i].salary}</p><br>`;
        }
        console.log("Employee added");
        return false;
    }
</script>
