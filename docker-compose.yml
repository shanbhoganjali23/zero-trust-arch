version: "3.9"

services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak-zt
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./enterprise-zt-realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  mfa-service:
    build:
      context: .
      dockerfile: Dockerfile.mfa
    container_name: mfa-service
    environment:
      MFA_PORT: "5010"
      MFA_ADMIN_TOKEN: "change-me"
      MFA_SECRET_DIR: "/app/mfa_secrets"
    ports:
      - "5010:5010"
    volumes:
      - mfa-secrets:/app/mfa_secrets
    depends_on:
      keycloak:
        condition: service_started

volumes:
  mfa-secrets:
